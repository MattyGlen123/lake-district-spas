ith Full Afternoon Tea\n - Spa use 1.00pm - 3.00pm \n- Afternoon Tea served after Spa Use in Hotel Lounge at 3.30pm.\n\n\nA truly warming and therapeutic experience. Each heat\nexperience is taken in turn in order to slowly raise your\nbody temperature whilst you relax reaping the holistic and\ntherapeutic benefits of water and heat, you will leave feeling\nrefreshed and invigorated.\n\nYour experience begins in the Aroma Salt inhalation Room, a\nwarm, gentle heat. Time to enjoy the relaxing massaging jets of\nthe Pedidarium on your feet, move on to the warm, moist heat of\nthe steam room and finish with the intense heat of the Sauna to\nwarm and relax all your muscles. Cool down in the feature Rain,\nSky \u0026 Monsoon shower, before soothing your aching muscles in\nthe Hydrotherapy Pool – invigorating massage jets then refresh\nyour body and mind in the Outdoor Spa Bath. \n\n**Important Information**\n\nFootwear: We kindly request that you bring your own suitable footwear, as this is not provided on the day of your visit. Alternatively, single-use flip-flops are available for purchase at an additional charge.\n\nDietary Requirements: Please ensure you inform us of any dietary restrictions or allergies in the free text section when confirming your booking. We are unable to accommodate specific needs on the day without prior notice.\n\nAge Restriction: Our spa services are strictly for guests aged 18 and over. If you have any questions regarding this policy, please do not hesitate to contact us.\n\nMedical Conditions and Pregnancy: For your safety, please inform us if you are undergoing treatment for a medical condition or are pregnant. Depending on the circumstances, we may need to adjust or limit the services we provide. Please include this information in the free text section when completing your booking to ensure a safe and enjoyable experience.","termsAndConditions":"","image":{"externalKey":"cec361c8538288b74d5191cabe8735ef","url":"https://hcommerce-live.s3.am
